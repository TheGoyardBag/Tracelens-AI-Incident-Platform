name: Test and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: CPU PyTorch
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,otel]"
      - run: python -m pytest -q --junitxml=reports/ci-tests.xml
      - name: Model integrity and import smoke
        run: |
          python scripts/check_artifacts.py
          python examples/otel_lab.py --out /tmp/lab-traces.json
          python scripts/import_otlp.py /tmp/lab-traces.json --id ci-lab --out /tmp/lab-incident.json
          python -m tracelens.cli rank /tmp/lab-incident.json > /tmp/diagnosis.json
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/frontend.test.mjs
      - working-directory: web
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - working-directory: web
        run: npm run typecheck && npm run build
