[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelens"
version = "0.1.0"
description = "Evidence-backed incident investigation with learned root-cause ranking"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "numpy>=2.0,<3", "scikit-learn>=1.5,<2", "torch>=2.6,<3",
  "httpx>=0.27,<1", "sqlalchemy>=2.0,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.17.1,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]
tracking = ["mlflow>=3,<4"]
graph = ["langgraph>=1,<2"]
otel = ["opentelemetry-sdk>=1.29,<2"]
browser = ["playwright>=1.49,<2"]

[project.scripts]
tracelens = "tracelens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracelens = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110
