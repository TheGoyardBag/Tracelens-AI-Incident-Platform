services:
  api:
    environment:
      DATABASE_URL: postgresql+psycopg://tracelens:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/tracelens
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tracelens
      POSTGRES_DB: tracelens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["tracelens-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracelens -d tracelens"]
      interval: 5s
      retries: 10
    # No host port: reachable only on the local compose network.
volumes:
  tracelens-postgres:
